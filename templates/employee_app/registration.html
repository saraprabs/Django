{% extends "employee_app/base.html" %}
{% block body_block %}

<div class="jumbotron">
    {% if registered %}
         <h1>Thank You for Registering!</h1>
    {% else %}
        <h1>Register Here!</h1>
        <h1>Fill out the form</h1>
        <form enctype='multipart/form-data' method = 'POST'>
            {% csrf_token %}
            {{ user_form.as_p }}
            {{ profile_form.as_p }}
            <input type ="submit" value="Register">
        </form>
    {% endif %}
   
</div>
{% endblock %}
